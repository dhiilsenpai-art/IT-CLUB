<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | IT Club Smancis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0B192C;
            --secondary-color: #FFFFFF;
            --accent-color: #00FFFF;
            --bg-card: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-color);
            color: var(--secondary-color);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Stat Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-card h3 { font-size: 0.9rem; opacity: 0.7; }
        .stat-card p { font-size: 1.8rem; font-weight: 700; color: var(--accent-color); }

        /* Table */
        .table-container {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid rgba(255,255,255,0.1); color: var(--accent-color); }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        tr:hover { background: rgba(0, 255, 255, 0.05); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Dashboard Admin</h1>
            <button onclick="window.location.reload()" style="background: var(--accent-color); padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer;">Refresh Data</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><h3>Total Pendaftar</h3><p id="total-pendaftar">0</p></div>
            <div class="stat-card"><h3>Divisi Hardware</h3><p id="total-hardware">0</p></div>
            <div class="stat-card"><h3>Divisi Software</h3><p id="total-software">0</p></div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Kelas</th>
                        <th>Divisi</th>
                        <th>Alasan</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('recruitment-form').addEventListener('submit', function(e) {
            e.preventDefault(); 
            document.getElementById('form-area').style.display = 'none';
            document.getElementById('success-message').style.display = 'block';
        });
        // Simulasi data (Ganti ini dengan data dari Google Sheets/Database kamu)
        const pendaftar = [
            {nama: "Budi Santoso", kelas: "X IPA 1", divisi: "Software", alasan: "Ingin belajar coding"},
            {nama: "Siti Aminah", kelas: "XI IPS 2", divisi: "Multimedia", alasan: "Suka desain"},
        ];

        function renderTable(data) {
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            data.forEach(item => {
                body.innerHTML += `<tr><td>${item.nama}</td><td>${item.kelas}</td><td>${item.divisi}</td><td>${item.alasan}</td></tr>`;
            });
            document.getElementById('total-pendaftar').innerText = data.length;
        }

        renderTable(pendaftar);
    </script>
</body>
</html>
